<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Users API</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 2rem;
    }

    header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    header h1 { font-size: 1.75rem; font-weight: 700; }
    header span {
      background: #22c55e;
      color: #0f172a;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .toolbar {
      display: flex;
      gap: .75rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      align-items: center;
    }

    input {
      background: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: .5rem .9rem;
      border-radius: .5rem;
      font-size: .9rem;
      width: 220px;
      outline: none;
    }
    input:focus { border-color: #6366f1; }
    input::placeholder { color: #64748b; }

    button {
      padding: .5rem 1.1rem;
      border-radius: .5rem;
      border: none;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s;
    }
    button:hover { opacity: .85; }
    .btn-add    { background: #6366f1; color: #fff; }
    .btn-reload { background: #1e293b; color: #94a3b8; border: 1px solid #334155; }
    .btn-del    { background: transparent; color: #f87171; border: none; font-size: 1rem; cursor: pointer; padding: .2rem .5rem; border-radius: .4rem; }
    .btn-del:hover { background: #450a0a33; }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #1e293b;
      border-radius: .75rem;
      overflow: hidden;
      font-size: .9rem;
    }

    thead { background: #0f172a; }
    th { padding: .85rem 1.2rem; text-align: left; color: #64748b; font-weight: 600; font-size: .78rem; text-transform: uppercase; letter-spacing: .07em; }
    td { padding: .85rem 1.2rem; border-top: 1px solid #0f172a; }
    tr:hover td { background: #263147; }

    .badge-id {
      background: #312e81;
      color: #a5b4fc;
      font-size: .75rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
    }

    .pagination {
      display: flex;
      align-items: center;
      gap: .75rem;
      margin-top: 1.25rem;
      justify-content: flex-end;
      font-size: .85rem;
      color: #94a3b8;
    }
    .pagination button { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; padding: .35rem .9rem; font-size: .85rem; }
    .pagination button:disabled { opacity: .35; cursor: not-allowed; }

    .modal-backdrop {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.6);
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .modal-backdrop.open { display: flex; }

    .modal {
      background: #1e293b;
      border-radius: .75rem;
      padding: 1.75rem;
      width: 360px;
      border: 1px solid #334155;
    }
    .modal h2 { margin-bottom: 1.25rem; font-size: 1.1rem; }

    .field { display: flex; flex-direction: column; gap: .35rem; margin-bottom: 1rem; }
    .field label { font-size: .8rem; color: #94a3b8; }
    .field input { width: 100%; }

    .modal-actions { display: flex; gap: .75rem; justify-content: flex-end; margin-top: 1.25rem; }
    .btn-cancel { background: #0f172a; color: #94a3b8; border: 1px solid #334155; }

    .toast {
      position: fixed; bottom: 1.5rem; right: 1.5rem;
      background: #22c55e; color: #0f172a;
      padding: .65rem 1.2rem; border-radius: .6rem;
      font-weight: 600; font-size: .875rem;
      opacity: 0; transform: translateY(8px);
      transition: opacity .2s, transform .2s;
      pointer-events: none;
    }
    .toast.err { background: #ef4444; color: #fff; }
    .toast.show { opacity: 1; transform: none; }

    .empty { text-align: center; color: #475569; padding: 3rem; }
  </style>
</head>
<body>

<header>
  <h1>Users API</h1>
  <span>Live</span>
</header>

<div class="toolbar">
  <button class="btn-reload" onclick="load()">↻ Odśwież</button>
  <button class="btn-add" onclick="openModal()">+ Dodaj użytkownika</button>
  <span id="stats" style="margin-left:auto;color:#64748b;font-size:.85rem;"></span>
</div>

<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Imię i nazwisko</th>
      <th>E-mail</th>
      <th>Utworzono</th>
      <th></th>
    </tr>
  </thead>
  <tbody id="tbody">
    <tr><td colspan="5" class="empty">Ładowanie…</td></tr>
  </tbody>
</table>

<div class="pagination">
  <button id="btn-prev" onclick="prevPage()" disabled>← Poprzednia</button>
  <span id="page-info"></span>
  <button id="btn-next" onclick="nextPage()">Następna →</button>
</div>

<!-- Modal dodawania -->
<div class="modal-backdrop" id="modal">
  <div class="modal">
    <h2>Nowy użytkownik</h2>
    <div class="field">
      <label>Imię i nazwisko *</label>
      <input id="inp-name" placeholder="np. Piotr Zielony" />
    </div>
    <div class="field">
      <label>E-mail *</label>
      <input id="inp-email" type="email" placeholder="np. piotr@example.com" />
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Anuluj</button>
      <button class="btn-add" onclick="addUser()">Dodaj</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  let page = 1;
  const limit = 5;
  let totalPages = 1;

  async function load() {
    const res  = await fetch(`/users?page=${page}&limit=${limit}`);
    const json = await res.json();
    totalPages = json.totalPages;

    const tbody = document.getElementById('tbody');
    document.getElementById('stats').textContent =
      `Łącznie: ${json.total} użytkowników`;
    document.getElementById('page-info').textContent =
      `Strona ${json.page} / ${json.totalPages}`;
    document.getElementById('btn-prev').disabled = page <= 1;
    document.getElementById('btn-next').disabled = page >= totalPages;

    if (!json.data.length) {
      tbody.innerHTML = '<tr><td colspan="5" class="empty">Brak użytkowników.</td></tr>';
      return;
    }

    tbody.innerHTML = json.data.map(u => `
      <tr>
        <td><span class="badge-id">#${u.id}</span></td>
        <td>${esc(u.name)}</td>
        <td>${esc(u.email)}</td>
        <td>${new Date(u.createdAt).toLocaleDateString('pl-PL')}</td>
        <td><button class="btn-del" onclick="deleteUser(${u.id})" title="Usuń">✕</button></td>
      </tr>
    `).join('');
  }

  function prevPage() { if (page > 1) { page--; load(); } }
  function nextPage() { if (page < totalPages) { page++; load(); } }

  function openModal() {
    document.getElementById('inp-name').value = '';
    document.getElementById('inp-email').value = '';
    document.getElementById('modal').classList.add('open');
    document.getElementById('inp-name').focus();
  }
  function closeModal() { document.getElementById('modal').classList.remove('open'); }

  async function addUser() {
    const name  = document.getElementById('inp-name').value.trim();
    const email = document.getElementById('inp-email').value.trim();
    const res   = await fetch('/users', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email }),
    });
    const json = await res.json();
    if (!res.ok) {
      toast((json.details || [json.error]).join(' '), true);
      return;
    }
    closeModal();
    toast(`Dodano: ${json.name}`);
    page = 1;
    load();
  }

  async function deleteUser(id) {
    if (!confirm('Usunąć tego użytkownika?')) return;
    const res = await fetch(`/users/${id}`, { method: 'DELETE' });
    if (res.status === 204) { toast('Użytkownik usunięty.'); load(); }
    else toast('Błąd przy usuwaniu.', true);
  }

  function toast(msg, err = false) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast' + (err ? ' err' : '') + ' show';
    setTimeout(() => el.classList.remove('show'), 3000);
  }

  function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  load();
</script>
</body>
</html>
