<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Agent Network Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg:#0a0e1a; --panel:#111827; --border:#1e293b; --text:#e2e8f0; --muted:#64748b; --accent:#3b82f6; }
  body { background:var(--bg); color:var(--text); font-family:'Segoe UI',sans-serif; height:100vh; display:flex; flex-direction:column; overflow:hidden; }

  header { display:flex; align-items:center; gap:12px; padding:10px 18px; background:var(--panel); border-bottom:1px solid var(--border); flex-shrink:0; }
  header h1 { font-size:.95rem; font-weight:600; }
  .badge { font-size:.7rem; padding:2px 8px; border-radius:999px; background:#1e3a5f; color:#60a5fa; }
  .badge.connected { background:#14532d; color:#4ade80; }
  .badge.error { background:#7f1d1d; color:#fca5a5; }
  .dot { width:8px; height:8px; border-radius:50%; background:#10b981; animation:pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.3} }
  .hdr-stats { margin-left:auto; display:flex; gap:18px; font-size:.75rem; color:var(--muted); }
  .hdr-stats span b { color:var(--text); }
  .hdr-stats .ruflo-count { color:#4ade80; }

  .main { display:flex; flex:1; overflow:hidden; }
  #graph { flex:1; position:relative; }
  svg { width:100%; height:100%; }

  .link { stroke:#334155; stroke-opacity:.5; stroke-width:1.5; }
  .link.flash { stroke-opacity:1; stroke-width:3; stroke-dasharray:8; animation:dash .7s linear infinite; }
  @keyframes dash { to { stroke-dashoffset:-16; } }

  .node circle { stroke-width:2.5; cursor:pointer; }
  .node text.icon { text-anchor:middle; dominant-baseline:central; pointer-events:none; }
  .node text.lbl { text-anchor:middle; fill:var(--muted); font-size:9px; pointer-events:none; }

  .sidebar { width:290px; background:var(--panel); border-left:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }
  .sec-title { padding:9px 14px; font-size:.68rem; font-weight:700; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); border-bottom:1px solid var(--border); }
  #agent-list { overflow-y:auto; max-height:50vh; }
  .ai { display:flex; align-items:center; gap:9px; padding:7px 13px; border-bottom:1px solid var(--border); cursor:pointer; transition:background .12s; }
  .ai:hover { background:rgba(59,130,246,.07); }
  .ai.sel { background:rgba(59,130,246,.14); }
  .ai.real-agent { border-left:3px solid #4ade80; }
  .ai-dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .ai-info { flex:1; min-width:0; }
  .ai-name { font-size:.78rem; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ai-name.real { color:#4ade80; }
  .ai-task { font-size:.68rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sb { font-size:.63rem; padding:1px 5px; border-radius:4px; flex-shrink:0; }
  .s-idle{background:#1e293b;color:#64748b} .s-thinking{background:#1e3a5f;color:#60a5fa}
  .s-working{background:#14532d;color:#4ade80} .s-communicating{background:#451a03;color:#fb923c}
  .s-done{background:#1a2e05;color:#a3e635}

  .log-wrap { flex:1; display:flex; flex-direction:column; overflow:hidden; }
  #msg-log { overflow-y:auto; flex:1; }
  .mi { padding:5px 13px; font-size:.7rem; border-bottom:1px solid rgba(30,41,59,.4); }
  .mi .from { color:var(--accent); font-weight:600; }
  .mi .arr { color:var(--muted); margin:0 3px; }
  .mi .to { color:#a78bfa; font-weight:600; }
  .mi .txt { color:var(--muted); margin-top:1px; }
  .mi.new { animation:flash .5s ease-out; }
  @keyframes flash { from{background:rgba(59,130,246,.18)} to{background:transparent} }

  #tip { position:absolute; background:#1e293b; border:1px solid var(--border); border-radius:8px; padding:9px 13px; font-size:.76rem; pointer-events:none; opacity:0; transition:opacity .12s; z-index:9; min-width:170px; }
  #conn-count { font-size:.68rem; color:var(--accent); margin-top:3px; }
  .real-tag { background:#14532d; color:#4ade80; font-size:.6rem; padding:1px 5px; border-radius:4px; margin-left:5px; }

  #err { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); background:#7f1d1d; color:#fca5a5; padding:7px 18px; border-radius:8px; font-size:.8rem; display:none; }
</style>
</head>
<body>
<header>
  <div class="dot"></div>
  <h1>🤖 Agent Network Dashboard</h1>
  <span class="badge" id="mode-badge">SSE …</span>
  <div class="hdr-stats">
    <span>Agenci: <b id="s-total">0</b></span>
    <span>Aktywni: <b id="s-active">0</b></span>
    <span>Ruflo: <b id="s-ruflo" class="ruflo-count">0</b></span>
    <span>Eventy: <b id="s-events">0</b></span>
  </div>
</header>

<div class="main">
  <div id="graph">
    <svg id="svg"></svg>
    <div id="tip"></div>
  </div>
  <aside class="sidebar">
    <div class="sec-title">Agenci</div>
    <div id="agent-list"></div>
    <div class="log-wrap">
      <div class="sec-title">📡 Komunikacja</div>
      <div id="msg-log"></div>
    </div>
  </aside>
</div>
<div id="err">Brak połączenia z serwerem…</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────────
let nodes=[], links=[], agentTypes={}, lastMsgs=[], selId=null;
let sim, linkSel, nodeSel, svgG;
let flashTimers={};
let eventCount=0;

const COLORS = {
  orchestrator:'#f59e0b', planner:'#8b5cf6', coder:'#3b82f6',
  reviewer:'#10b981', tester:'#06b6d4', researcher:'#f97316',
  'security-architect':'#ef4444', 'memory-specialist':'#ec4899'
};
const ICONS = {
  orchestrator:'👑', planner:'🗺️', coder:'💻', reviewer:'🔍',
  tester:'🧪', researcher:'🔬', 'security-architect':'🛡️', 'memory-specialist':'🧠'
};
const TIERS = { orchestrator:0, planner:1 };
function tier(t){ return TIERS[t]??2; }
function radius(t){ return tier(t)===0?22:tier(t)===1?16:13; }
function color(t){ return COLORS[t]||'#60a5fa'; }
function icon(t){ return ICONS[t]||'🤖'; }

// ── SSE connection ─────────────────────────────────────────────────────────────
let prevMsgIds = new Set();
let reconnectDelay = 1000;

function connectSSE() {
  const badge = document.getElementById('mode-badge');
  const es = new EventSource('/api/agents/stream');

  es.onopen = () => {
    document.getElementById('err').style.display = 'none';
    badge.textContent = 'SSE ✓';
    badge.className = 'badge connected';
    reconnectDelay = 1000;
  };

  es.onmessage = (e) => {
    try {
      const evt = JSON.parse(e.data);
      eventCount++;
      document.getElementById('s-events').textContent = eventCount;
      handleEvent(evt);
    } catch (_) { /* ignore malformed */ }
  };

  es.onerror = () => {
    es.close();
    badge.textContent = 'SSE ✗';
    badge.className = 'badge error';
    document.getElementById('err').style.display = 'block';
    setTimeout(() => connectSSE(), reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 2, 30000);
  };
}

// ── Event dispatcher ───────────────────────────────────────────────────────────
function handleEvent(evt) {
  if (evt.type === 'init') {
    bootstrapGraph(evt.payload);
  } else if (evt.type === 'agent:update') {
    const n = nodes.find(n => n.id === evt.payload.id);
    if (n) {
      Object.assign(n, { status: evt.payload.status, task: evt.payload.task });
      updateVisuals();
      renderList();
    }
  } else if (evt.type === 'message') {
    const msg = evt.payload;
    if (!prevMsgIds.has(msg.id)) {
      prevMsgIds.add(msg.id);
      flashLink(msg.from, msg.to);
      prependLog(msg);
    }
  }
  updateStats();
}

// ── Bootstrap graph from init payload ──────────────────────────────────────────
function bootstrapGraph(data) {
  agentTypes = data.agentTypes || {};

  // Preserve existing node positions
  const posMap = {};
  nodes.forEach(n => { if (n.x !== undefined) posMap[n.id] = { x: n.x, y: n.y, vx: n.vx, vy: n.vy }; });

  nodes = (data.agents || []).map(a => {
    const pos = posMap[a.id];
    return pos ? { ...a, ...pos } : { ...a };
  });
  links = buildLinks(nodes);

  if (!sim) {
    initGraph();
  } else {
    rebuildGraph();
  }

  updateStats();
  renderList();
}

function buildLinks(ns){
  const out=[];
  ns.forEach(n=>{
    (n.connections||[]).forEach(tid=>{
      const key=`${n.id}__${tid}`;
      if(!out.find(l=>l.id===key)) out.push({id:key,source:n.id,target:tid});
    });
  });
  return out;
}

// ── Stats ────────────────────────────────────────────────────────────────────
function updateStats() {
  document.getElementById('s-total').textContent  = nodes.length;
  document.getElementById('s-active').textContent = nodes.filter(n => n.status !== 'idle').length;
  document.getElementById('s-ruflo').textContent  = nodes.filter(n => n.real === true).length;
}

// ── D3 ─────────────────────────────────────────────────────────────────────────
function initGraph(){
  const el=document.getElementById('svg');
  el.innerHTML='';
  const W=el.clientWidth, H=el.clientHeight;
  const svg=d3.select('#svg');
  svgG=svg.append('g');

  // zoom
  svg.call(d3.zoom().scaleExtent([.25,4]).on('zoom',e=>svgG.attr('transform',e.transform)));

  // glow filter
  const defs=svg.append('defs');
  const f=defs.append('filter').attr('id','glow');
  f.append('feGaussianBlur').attr('stdDeviation','3').attr('result','blur');
  const fm=f.append('feMerge');
  fm.append('feMergeNode').attr('in','blur');
  fm.append('feMergeNode').attr('in','SourceGraphic');

  linkSel=svgG.append('g').selectAll('line')
    .data(links,d=>d.id).enter().append('line').attr('class','link');

  nodeSel=svgG.append('g').selectAll('g.node')
    .data(nodes,d=>d.id).enter().append('g').attr('class','node')
    .call(d3.drag()
      .on('start',(e,d)=>{if(!e.active)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y;})
      .on('drag', (e,d)=>{d.fx=e.x;d.fy=e.y;})
      .on('end',  (e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null;}))
    .on('click',(_,d)=>selectNode(d.id))
    .on('mouseover',(e,d)=>showTip(e,d))
    .on('mousemove',(e)=>moveTip(e))
    .on('mouseout',()=>hideTip());

  nodeSel.append('circle')
    .attr('r',d=>radius(d.type))
    .attr('fill',d=>nodeColor(d)+'28')
    .attr('stroke',d=>nodeStroke(d))
    .attr('stroke-width',d=>d.real?3.5:2.5)
    .style('filter','url(#glow)');

  nodeSel.append('text').attr('class','icon')
    .attr('y',1).style('font-size',d=>tier(d.type)===0?'15px':'11px').text(d=>icon(d.type));

  nodeSel.append('text').attr('class','lbl')
    .attr('y',d=>radius(d.type)+11).text(d=>d.name)
    .attr('fill',d=>d.real?'#4ade80':null);

  sim=d3.forceSimulation(nodes)
    .force('link',d3.forceLink(links).id(d=>d.id).distance(120))
    .force('charge',d3.forceManyBody().strength(-350))
    .force('center',d3.forceCenter(W/2,H/2))
    .force('collide',d3.forceCollide(45))
    .on('tick',()=>{
      linkSel.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y)
             .attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
      nodeSel.attr('transform',d=>`translate(${d.x},${d.y})`);
    });
}

function rebuildGraph() {
  const el=document.getElementById('svg');
  const W=el.clientWidth, H=el.clientHeight;

  // Re-bindlinks
  linkSel = svgG.select('g:first-child').selectAll('line').data(links, d=>d.id);
  linkSel.exit().remove();
  linkSel = linkSel.enter().append('line').attr('class','link').merge(linkSel);

  // Re-bind nodes
  const nodeG = svgG.select('g:nth-child(2)');
  nodeSel = nodeG.selectAll('g.node').data(nodes, d=>d.id);
  nodeSel.exit().remove();
  const enter = nodeSel.enter().append('g').attr('class','node')
    .call(d3.drag()
      .on('start',(e,d)=>{if(!e.active)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y;})
      .on('drag', (e,d)=>{d.fx=e.x;d.fy=e.y;})
      .on('end',  (e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null;}))
    .on('click',(_,d)=>selectNode(d.id))
    .on('mouseover',(e,d)=>showTip(e,d))
    .on('mousemove',(e)=>moveTip(e))
    .on('mouseout',()=>hideTip());

  enter.append('circle')
    .attr('r',d=>radius(d.type))
    .attr('fill',d=>nodeColor(d)+'28')
    .attr('stroke',d=>nodeStroke(d))
    .attr('stroke-width',d=>d.real?3.5:2.5)
    .style('filter','url(#glow)');
  enter.append('text').attr('class','icon')
    .attr('y',1).style('font-size',d=>tier(d.type)===0?'15px':'11px').text(d=>icon(d.type));
  enter.append('text').attr('class','lbl')
    .attr('y',d=>radius(d.type)+11).text(d=>d.name)
    .attr('fill',d=>d.real?'#4ade80':null);

  nodeSel = enter.merge(nodeSel);

  sim.nodes(nodes);
  sim.force('link').links(links);
  sim.force('center', d3.forceCenter(W/2, H/2));
  sim.alpha(.3).restart();

  updateVisuals();
}

// ── Node color helpers ─────────────────────────────────────────────────────────
function nodeColor(d){ return d.real ? '#4ade80' : color(d.type); }
function nodeStroke(d){ return d.real ? '#4ade80' : color(d.type); }

// Status → visual modifiers
const STATUS_RING = {
  working:       { strokeW: 3,   opacity: 'aa', pulse: true  },
  thinking:      { strokeW: 2,   opacity: '55', pulse: false },
  communicating: { strokeW: 4,   opacity: 'dd', pulse: true  },
  done:          { strokeW: 2,   opacity: '33', pulse: false },
  idle:          { strokeW: 1.5, opacity: '22', pulse: false },
};

function statusStrokeColor(d){
  const n = nodes.find(n=>n.id===d.id)||d;
  const s = n.status||'idle';
  if(s==='communicating') return '#fb923c';
  if(s==='thinking')      return '#60a5fa';
  if(s==='done')          return '#4ade80';
  return n.real ? '#4ade80' : color(n.type);
}

function updateVisuals(){
  if(!nodeSel) return;
  nodeSel.select('circle')
    .attr('stroke', d => statusStrokeColor(d))
    .attr('fill',   d => { const n=nodes.find(n=>n.id===d.id)||d; const m=STATUS_RING[n.status]||STATUS_RING.idle; return nodeColor(n)+(selId===d.id?'55':m.opacity); })
    .attr('r',      d => { const n=nodes.find(n=>n.id===d.id)||d; const base=radius(n.type); const active=n.status==='working'||n.status==='communicating'; return base+(selId===d.id?5:active?2:0); })
    .attr('stroke-width', d => { const n=nodes.find(n=>n.id===d.id)||d; const m=STATUS_RING[n.status]||STATUS_RING.idle; return selId===d.id?4:n.real?Math.max(m.strokeW,3.5):m.strokeW; });
}

// ── Flash ──────────────────────────────────────────────────────────────────────
function flashLink(fromId, toId){
  if(!linkSel) return;
  const key=`${fromId}__${toId}`;
  const rev=`${toId}__${fromId}`;
  linkSel
    .filter(d=>d.id===key||d.id===rev)
    .classed('flash',true)
    .attr('stroke',d=>color(nodes.find(n=>n.id===(d.source.id||d.source))?.type||''));
  clearTimeout(flashTimers[key]);
  flashTimers[key]=setTimeout(()=>{
    if(linkSel) linkSel.filter(d=>d.id===key||d.id===rev).classed('flash',false).attr('stroke','#334155');
  },1800);
}

// ── Tooltip ────────────────────────────────────────────────────────────────────
const tip=document.getElementById('tip');
function showTip(e,d){
  const conns=(d.connections||[]).length;
  const realTag = d.real ? '<span class="real-tag">ruflo</span>' : '';
  tip.innerHTML=`<b>${icon(d.type)} ${d.name}${realTag}</b><br>
    <span style="color:${nodeColor(d)}">${d.type}</span> &bull;
    <span class="sb s-${d.status}">${d.status}</span>
    <div style="color:var(--muted);margin-top:4px">${d.task||'oczekuje...'}</div>
    <div id="conn-count">Połączenia: ${conns}</div>`;
  tip.style.opacity=1; moveTip(e);
}
function moveTip(e){
  const r=document.getElementById('graph').getBoundingClientRect();
  let x=e.clientX-r.left+14, y=e.clientY-r.top-10;
  if(x+190>r.width) x-=200;
  tip.style.left=x+'px'; tip.style.top=y+'px';
}
function hideTip(){ tip.style.opacity=0; }

// ── Sidebar list ───────────────────────────────────────────────────────────────
function renderList(){
  document.getElementById('agent-list').innerHTML=nodes.map(n=>`
    <div class="ai${n.id===selId?' sel':''}${n.real?' real-agent':''}" onclick="selectNode('${n.id}')">
      <div class="ai-dot" style="background:${nodeColor(n)}"></div>
      <div class="ai-info">
        <div class="ai-name${n.real?' real':''}">${icon(n.type)} ${n.name}</div>
        <div class="ai-task">${n.task||'oczekuje...'}</div>
      </div>
      <span class="sb s-${n.status}">${n.status}</span>
    </div>`).join('');
}

function selectNode(id){
  selId=selId===id?null:id;
  renderList();
  updateVisuals();
}

// ── Log ────────────────────────────────────────────────────────────────────────
function agentName(id){ return nodes.find(n=>n.id===id)?.name||id; }

function prependLog(m){
  const el=document.getElementById('msg-log');
  const d=document.createElement('div');
  d.className='mi new';
  d.innerHTML=`<div><span class="from">${agentName(m.from)}</span><span class="arr">→</span><span class="to">${agentName(m.to)}</span></div><div class="txt">${m.text}</div>`;
  el.prepend(d);
  while(el.children.length>40) el.lastChild.remove();
}

// ── Start ──────────────────────────────────────────────────────────────────────
connectSSE();
</script>
</body>
</html>
